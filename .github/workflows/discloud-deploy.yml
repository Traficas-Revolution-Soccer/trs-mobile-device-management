name: Request Discloud deployment

on:
  pull_request:
    branches: [QA]
    types: [closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch-qa:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch QA deployment
        env:
          TOKEN: ${{ secrets.TRS_INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Merge commit SHA is missing" >&2; exit 1; }
          payload=$(jq -n --arg sha "$SHA" '{event_type:"deploy-qa",client_payload:{source_repository:"trs-mobile-device-management",source_ref:"QA",source_sha:$sha}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Traficas-Revolution-Soccer/trs-infra/dispatches \
            -d "$payload"

  dispatch-production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Production releases must point to a commit on main" >&2
            exit 1
          }
      - name: Dispatch production deployment
        env:
          TOKEN: ${{ secrets.TRS_INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Release commit SHA is missing" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must use vMAJOR.MINOR.PATCH" >&2; exit 1; }
          payload=$(jq -n --arg sha "$SHA" --arg tag "$TAG" '{event_type:"deploy-production",client_payload:{source_repository:"trs-mobile-device-management",source_ref:$tag,source_sha:$sha}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Traficas-Revolution-Soccer/trs-infra/dispatches \
            -d "$payload"
